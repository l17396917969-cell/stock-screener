<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Stock Screener AI</title>
<style>
  :root {
    --bg: #0a0a0f;
    --surface: #14141f;
    --card: #1a1a2e;
    --primary: #6366f1;
    --accent: #22c55e;
    --text: #e2e8f0;
    --muted: #94a3b8;
    --border: #1e293b;
    --danger: #ef4444;
    --warn: #f59e0b;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, 'SF Pro Text', 'PingFang SC', sans-serif;
    height: 100dvh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  header {
    padding: 12px 16px;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    gap: 10px;
    flex-shrink: 0;
  }
  header .logo {
    width: 32px; height: 32px;
    background: linear-gradient(135deg, var(--primary), #a855f7);
    border-radius: 8px;
    display: flex; align-items: center; justify-content: center;
    font-size: 16px;
  }
  header h1 { font-size: 16px; font-weight: 600; }
  header .status { margin-left: auto; font-size: 12px; color: var(--muted); display: flex; align-items: center; gap: 6px; }
  .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--accent); }
  .dot.off { background: var(--muted); }
  .dot.busy { background: var(--warn); animation: pulse 1s infinite; }
  @keyframes pulse { 0%,100%{opacity:0.3} 50%{opacity:1} }

  #chat {
    flex: 1;
    overflow-y: auto;
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .msg {
    max-width: 90%;
    padding: 12px 16px;
    border-radius: 16px;
    font-size: 14px;
    line-height: 1.6;
    animation: fadeIn 0.3s ease;
  }
  @keyframes fadeIn { from{opacity:0;transform:translateY(8px)} to{opacity:1;transform:translateY(0)} }
  .msg.user {
    align-self: flex-end;
    background: var(--primary);
    color: white;
    border-bottom-right-radius: 4px;
  }
  .msg.ai {
    align-self: flex-start;
    background: var(--card);
    border: 1px solid var(--border);
    border-bottom-left-radius: 4px;
  }
  .msg.system {
    align-self: flex-start;
    background: transparent;
    border: 1px dashed var(--border);
    color: var(--muted);
    font-size: 12px;
    padding: 8px 12px;
    border-radius: 8px;
    max-width: 100%;
    font-family: 'SF Mono', monospace;
  }
  .msg.system.pass { border-color: var(--accent); color: var(--accent); }
  .msg.system.fail { border-color: var(--danger); color: var(--danger); }

  /* Stock Cards */
  .card-row {
    display: flex;
    gap: 10px;
    overflow-x: auto;
    padding-bottom: 4px;
    align-self: stretch;
    scroll-snap-type: x mandatory;
  }
  .stock-card {
    min-width: 180px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 14px;
    flex-shrink: 0;
    scroll-snap-align: start;
    transition: border-color 0.2s;
  }
  .stock-card:hover { border-color: var(--primary); }
  .stock-card .code { font-size: 12px; color: var(--muted); }
  .stock-card .name { font-size: 16px; font-weight: 700; margin: 2px 0 8px; }
  .stock-card .metrics { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; font-size: 11px; }
  .metric-val { font-weight: 600; }
  .metric-val.up { color: var(--accent); }
  .metric-val.down { color: var(--danger); }
  .metric-label { color: var(--muted); font-size: 10px; }
  .stock-card .score {
    margin-top: 10px; text-align: center;
    font-size: 22px; font-weight: 800;
    background: linear-gradient(135deg, var(--primary), var(--accent));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  .stock-card .ai-note {
    margin-top: 8px; font-size: 11px; color: var(--muted);
    border-top: 1px solid var(--border); padding-top: 8px;
  }

  /* Summaries */
  .summary {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 14px;
    font-size: 13px;
    line-height: 1.7;
  }
  .summary h3 { font-size: 14px; margin-bottom: 6px; color: var(--primary); }
  .summary table { width: 100%; border-collapse: collapse; margin: 8px 0; font-size: 12px; }
  .summary th, .summary td { padding: 6px 8px; border: 1px solid var(--border); text-align: center; }
  .summary th { background: var(--surface); }

  /* Skeleton */
  .skeleton { background: linear-gradient(90deg, var(--card) 25%, var(--surface) 50%, var(--card) 75%); background-size: 200% 100%; animation: shimmer 1.5s infinite; border-radius: 10px; height: 60px; }
  @keyframes shimmer { 0%{background-position:200% 0} 100%{background-position:-200% 0} }

  /* Input */
  footer {
    padding: 12px 16px 24px;
    background: var(--surface);
    border-top: 1px solid var(--border);
    flex-shrink: 0;
  }
  .input-row {
    display: flex;
    gap: 8px;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 24px;
    padding: 4px 4px 4px 16px;
    align-items: center;
  }
  .input-row input {
    flex: 1;
    background: none;
    border: none;
    color: var(--text);
    font-size: 14px;
    outline: none;
    padding: 8px 0;
  }
  .input-row input::placeholder { color: var(--muted); }
  .input-row button {
    background: var(--primary);
    color: white;
    border: none;
    border-radius: 20px;
    width: 36px; height: 36px;
    font-size: 18px;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: opacity 0.2s;
    flex-shrink: 0;
  }
  .input-row button:disabled { opacity: 0.4; cursor: not-allowed; }
  .quick-actions {
    display: flex; gap: 6px; margin-top: 8px; flex-wrap: wrap;
  }
  .quick-btn {
    background: var(--card);
    border: 1px solid var(--border);
    color: var(--muted);
    font-size: 12px;
    padding: 5px 12px;
    border-radius: 16px;
    cursor: pointer;
    transition: all 0.2s;
  }
  .quick-btn:hover { border-color: var(--primary); color: var(--text); }

  /* Step Timeline */
  .step-timeline {
    position: relative;
    padding-left: 24px;
    margin: 8px 0;
    align-self: stretch;
  }
  .step-timeline::before {
    content: '';
    position: absolute;
    left: 8px; top: 0; bottom: 0;
    width: 2px;
    background: var(--border);
  }
  .step-item {
    position: relative;
    padding: 10px 14px;
    margin-bottom: 8px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 10px;
    font-size: 13px;
    transition: all 0.3s;
  }
  .step-item::before {
    content: '';
    position: absolute;
    left: -20px; top: 16px;
    width: 8px; height: 8px;
    border-radius: 50%;
    background: var(--border);
    transition: background 0.3s;
  }
  .step-item.active::before { background: var(--primary); animation: pulse 1.5s infinite; }
  .step-item.done::before { background: var(--accent); }
  .step-item.fail::before { background: var(--danger); }
  .step-item .step-label {
    font-size: 10px;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.5px;
    margin-bottom: 2px;
  }
  .step-item .step-title { font-weight: 600; }
  .step-item .step-detail { font-size: 12px; color: var(--muted); margin-top: 2px; }

  /* Markdown content */
  .md-content { font-size: 13px; line-height: 1.8; }
  .md-content h1,.md-content h2,.md-content h3,.md-content h4 { color: var(--text); margin: 10px 0 6px; }
  .md-content h1 { font-size: 20px; } .md-content h2 { font-size: 17px; } .md-content h3 { font-size: 15px; } .md-content h4 { font-size: 13px; }
  .md-content table { width: 100%; border-collapse: collapse; margin: 8px 0; font-size: 11px; }
  .md-content td { padding: 5px 6px; border: 1px solid var(--border); text-align: center; }
  .md-content b { color: var(--accent); }
  .md-content p { margin: 0 0 6px; }

  /* Stock Detail Card */
  .stock-detail-card { padding: 4px 0; }
  .sdc-header { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; }
  .sdc-name { font-size: 18px; font-weight: 700; }
  .sdc-code { font-size: 12px; color: var(--muted); }
  .sdc-score { margin-left: auto; font-size: 28px; font-weight: 800; background: linear-gradient(135deg, var(--primary), var(--accent)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
  .sdc-breakdown { display: flex; flex-direction: column; gap: 4px; margin-bottom: 10px; }
  .sdc-bar { display: flex; align-items: center; gap: 6px; font-size: 11px; }
  .sdc-bar span:first-child { width: 32px; text-align: right; color: var(--muted); }
  .sdc-bar span:last-child { width: 36px; font-size: 10px; color: var(--muted); }
  .sbc-fill { height: 6px; border-radius: 3px; background: var(--primary); min-width: 2px; transition: width 0.5s; }
  .sdc-metrics { display: flex; gap: 12px; font-size: 11px; color: var(--muted); margin-bottom: 10px; padding: 8px 0; border-top: 1px solid var(--border); border-bottom: 1px solid var(--border); }
  .sdc-thesis { font-size: 12px; line-height: 1.7; color: var(--text); margin-bottom: 8px; }
  .sdc-rec { text-align: center; font-size: 14px; font-weight: 700; padding: 6px; border-radius: 8px; background: rgba(99,102,241,0.15); color: var(--primary); }

  /* ── 巴菲特评分卡片 ── */
  .buffett-card { margin-top: 10px; border-radius: 10px; border: 1px solid rgba(245,158,11,0.3); background: linear-gradient(135deg, rgba(245,158,11,0.08), rgba(245,158,11,0.02)); padding: 12px; }
  .buffett-title { font-size: 13px; color: #f59e0b; margin-bottom: 8px; display: flex; align-items: center; gap: 4px; }
  .buffett-title b { font-size: 16px; }
  .buffett-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 6px; }
  .buffett-item { background: rgba(0,0,0,0.15); border-radius: 6px; padding: 6px 8px; text-align: center; }
  .buffett-item span { display: block; font-size: 10px; color: var(--muted); margin-bottom: 2px; }
  .buffett-item b { font-size: 15px; color: #f59e0b; }
  .buffett-item sub { font-size: 10px; color: var(--muted); }
  .buffett-item.llm { border: 1px dashed rgba(99,102,241,0.4); }
  .buffett-item.llm b { color: var(--primary); }
  .buffett-extras { font-size: 11px; color: var(--muted); margin-top: 8px; text-align: center; }
</style>
</head>
<body>

<header>
  <div class="logo">📊</div>
  <h1>Stock Screener AI</h1>
  <a href="/scores" style="color:var(--muted);text-decoration:none;font-size:13px;padding:4px 10px;border:1px solid var(--border);border-radius:6px;transition:all .2s" onmouseover="this.style.borderColor='var(--primary)';this.style.color='var(--text)'" onmouseout="this.style.borderColor='var(--border)';this.style.color='var(--muted)'">📋 评分缓存</a>
  <div class="status"><span class="dot off" id="statusDot"></span><span id="statusText">就绪</span></div>
  <a href="#" onclick="document.getElementById('logoutForm').submit();return false" style="color:var(--muted);font-size:12px;text-decoration:none;margin-left:8px">⏻</a>
  <form id="logoutForm" method="POST" action="/logout" style="display:none"></form>
</header>

<div id="chat">
  <div class="msg ai">
    你好！我是 AI 选股助手。告诉我你想找什么样的股票，比如：<br>
    • 「帮我找被低估的潜力股」<br>
    • 「今天市场有哪些价值洼地」<br>
    • 「筛选 ROE>15% 的科技股」
  </div>
</div>

<footer>
  <div class="input-row">
    <input type="text" id="userInput" placeholder="告诉我想找什么样的股票..." autofocus>
    <button id="sendBtn" onclick="sendMessage()">↑</button>
  </div>
  <div class="quick-actions">
    <span class="quick-btn" onclick="quickAction('帮我找被低估的A股价值洼地')">💎 价值洼地</span>
    <span class="quick-btn" onclick="quickAction('分析当前热门板块的潜力股')">🔥 热门板块</span>
    <span class="quick-btn" onclick="quickAction('筛选高ROE低PE的科技股')">📈 高ROE科技</span>
  </div>
</footer>

<script>
let eventSource = null;

// ── 辅助函数 ──
function addMsg(text, type = 'ai') {
  const el = document.createElement('div');
  el.className = `msg ${type}`;
  if (type === 'ai') {
    el.innerHTML = text;  // AI 消息支持 HTML（Markdown 渲染后）
  } else {
    el.textContent = text;
  }
  document.getElementById('chat').appendChild(el);
  scrollDown();
  return el;
}

// 简易 Markdown → HTML
function md2html(md) {
  if (!md) return '';
  let h = md
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    // 标题
    .replace(/^#### (.+)$/gm, '<h4>$1</h4>')
    .replace(/^### (.+)$/gm, '<h3>$1</h3>')
    .replace(/^## (.+)$/gm, '<h2>$1</h2>')
    .replace(/^# (.+)$/gm, '<h1>$1</h1>')
    // 粗体 / 斜体
    .replace(/\*\*(.+?)\*\*/g, '<b>$1</b>')
    .replace(/\*(.+?)\*/g, '<i>$1</i>')
    // 表格
    .replace(/^\|(.+)\|$/gm, (line) => {
      if (line.includes('---')) return '';
      const cells = line.split('|').filter(c => c.trim()).map(c => '<td>' + c.trim() + '</td>');
      return '<tr>' + cells.join('') + '</tr>';
    })
    // 换行
    .replace(/\n\n/g, '</p><p>')
    .replace(/\n/g, '<br>');
  return '<div class="md-content"><p>' + h + '</p></div>';
}

function scrollDown() {
  const chat = document.getElementById('chat');
  chat.scrollTop = chat.scrollHeight;
}

function setStatus(busy) {
  const dot = document.getElementById('statusDot');
  const txt = document.getElementById('statusText');
  if (busy) {
    dot.className = 'dot busy';
    txt.textContent = '分析中…';
    document.getElementById('sendBtn').disabled = true;
    document.getElementById('userInput').disabled = true;
  } else {
    dot.className = 'dot';
    txt.textContent = '就绪';
    document.getElementById('sendBtn').disabled = false;
    document.getElementById('userInput').disabled = false;
  }
}

function addCards(stocks) {
  if (!stocks || stocks.length === 0) return;
  const container = document.createElement('div');
  container.className = 'card-row';
  stocks.forEach(s => {
    const card = document.createElement('div');
    card.className = 'stock-card';
    card.style.cursor = 'pointer';
    card.title = '点击查看深度分析';
    card.onclick = () => {
      document.getElementById('userInput').value = '分析 ' + (s.code || '');
      sendMessage();
    };
    card.innerHTML = `
      <div class="code">${s.code || '000000'}</div>
      <div class="name">${s.name || '—'}</div>
      <div class="metrics">
        <div><div class="metric-val ${(s.pe||0)>0?'':'down'}">${(s.pe||0).toFixed(1)}</div><div class="metric-label">PE</div></div>
        <div><div class="metric-val up">${(s.roe||0).toFixed(1)}%</div><div class="metric-label">ROE</div></div>
        <div><div class="metric-val">${(s.mcap||0)>100 ? (s.mcap/10000).toFixed(1)+'亿' : (s.mcap||'—')}</div><div class="metric-label">市值</div></div>
        <div><div class="metric-val">—</div><div class="metric-label">评分</div></div>
      </div>
      ${s.score ? `<div class="score">${s.score}</div>` : '<div class="score">'+(s.passed?'✅':'❌')+'</div>'}
      ${s.reason ? `<div class="ai-note">${s.reason}</div>` : ''}
    `;
    container.appendChild(card);
  });
  document.getElementById('chat').appendChild(container);
  scrollDown();
}

// ── 个股分析大卡片 ──
function addStockCard(d) {
  const el = document.createElement('div');
  el.className = 'msg ai';
  const bd = d.score_breakdown || {};
  el.innerHTML = '<div class="stock-detail-card">'
    + '<div class="sdc-header">'
    + '<span class="sdc-name">' + (d.resolved_name || '?') + '</span>'
    + '<span class="sdc-code">' + (d.resolved_code || '') + '</span>'
    + '<span class="sdc-score">' + (d.total_score || 0) + '</span>'
    + '</div>'
    + '<div class="sdc-breakdown">'
    + '<div class="sdc-bar"><span>估值</span><div class="sbc-fill" style="width:'+(bd['估值']||0)+'%"></div><span>'+(bd['估值']||0)+'/30</span></div>'
    + '<div class="sdc-bar"><span>质量</span><div class="sbc-fill" style="width:'+(bd['质量']||0)+'%"></div><span>'+(bd['质量']||0)+'/40</span></div>'
    + '<div class="sdc-bar"><span>成长</span><div class="sbc-fill" style="width:'+(bd['成长']||0)+'%"></div><span>'+(bd['成长']||0)+'/30</span></div>'
    + '</div>'
    + '<div class="sdc-metrics">'
    + '<span>PE ' + ((d.pe||0).toFixed(1)) + '</span>'
    + '<span>ROE ' + ((d.roe||0).toFixed(1)) + '%</span>'
    + '<span>📊 ' + (d.csic_sector||'') + '</span>'
    + '</div>'
    + (d.ai_thesis ? '<div class="sdc-thesis">🤖 ' + md2html(d.ai_thesis) + '</div>' : '')
    + (d.buffett_score ? _buffett_card(d) : '')
    + (d.recommendation ? '<div class="sdc-rec">' + d.recommendation + '</div>' : '')
    + '</div>';
  document.getElementById('chat').appendChild(el);
  scrollDown();
}

// ── 巴菲特评分卡片 (ValueClaw 6维框架) ──
function _buffett_card(d) {
  const bb = d.buffett_breakdown || {};
  const score = d.buffett_score || 0;
  const motd = bb.durable_moat || 0;
  const mgmt = bb.management_quality || 0;

  let extras = [];
  if (d.owner_earnings != null) {
    const oe = d.owner_earnings;
    extras.push('Owner Earnings: ' + (Math.abs(oe)>=1e8 ? (oe/1e8).toFixed(2)+'亿' : Math.abs(oe)>=1e4 ? (oe/1e4).toFixed(1)+'万' : oe.toFixed(0)));
  }
  if (d.fcf_yield != null) extras.push('FCF.Y: ' + d.fcf_yield.toFixed(1) + '%');
  if (d.peg != null) extras.push('PEG: ' + d.peg.toFixed(2));

  return '<div class="buffett-card">'
    + '<div class="buffett-title">🏦 巴菲特框架: <b>' + score + '/100</b></div>'
    + '<div class="buffett-grid">'
    + '<div class="buffett-item"><span>盈利稳定</span><b>' + (bb.consistent_earnings||0) + '</b><sub>/15</sub></div>'
    + '<div class="buffett-item"><span>低负债</span><b>' + (bb.low_debt||0) + '</b><sub>/15</sub></div>'
    + '<div class="buffett-item"><span>高ROE</span><b>' + (bb.high_roe||0) + '</b><sub>/15</sub></div>'
    + '<div class="buffett-item"><span>合理估值</span><b>' + (bb.reasonable_valuation||0) + '</b><sub>/20</sub></div>'
    + '<div class="buffett-item llm"><span>🏰 护城河</span><b>' + motd + '</b><sub>/20</sub></div>'
    + '<div class="buffett-item llm"><span>👔 管理层</span><b>' + mgmt + '</b><sub>/15</sub></div>'
    + '</div>'
    + (extras.length ? '<div class="buffett-extras">' + extras.join(' · ') + '</div>' : '')
    + '</div>';
}

// ── 思维链时间线 ──
function addTimelineStep(id, label, title, detail = '', status = 'active') {
  let tl = document.getElementById('timeline');
  if (!tl) {
    tl = document.createElement('div');
    tl.id = 'timeline';
    tl.className = 'step-timeline';
    document.getElementById('chat').appendChild(tl);
  }
  let el = document.getElementById('step-' + id);
  if (!el) {
    el = document.createElement('div');
    el.id = 'step-' + id;
    el.className = 'step-item';
    tl.appendChild(el);
  }
  el.className = 'step-item ' + status;
  el.innerHTML = '<div class="step-label">' + label + '</div>'
    + '<div class="step-title">' + title + '</div>'
    + (detail ? '<div class="step-detail">' + detail + '</div>' : '');
  scrollDown();
}

function clearTimeline() {
  const tl = document.getElementById('timeline');
  if (tl) tl.remove();
}

// ── SSE 流式分析 ──
async function quickAction(text) {
  document.getElementById('userInput').value = text;
  sendMessage();
}

function sendMessage() {
  const input = document.getElementById('userInput');
  const text = input.value.trim();
  if (!text) return;

  addMsg(text, 'user');
  input.value = '';
  setStatus(true);
  clearTimeline();

  // 检测是否为个股查询 (6 位数字代码 或 包含"分析/看看/查"等)
  const codeMatch = text.match(/\b(\d{6})\b/);
  const isStockQuery = codeMatch || /分析|看看|查一下|怎么看/.test(text);

  if (isStockQuery) {
    // ── 个股分析 ──
    let url = '/api/analyze_stock?';
    if (codeMatch) {
      url += 'code=' + codeMatch[1];
    } else {
      // 提取可能的股票名 (去掉分析/看看等前缀，把整个输入原文传给后端)
      const name = text.replace(/^(分析一下|分析|看看|查一下|怎么看|帮我|帮我分析|看一下|解读一下|解读)\s*/g, '').trim();
      url += 'name=' + encodeURIComponent(text);  // 传原文, 后端做二级清洗+LLM兜底
    }

    addTimelineStep('resolve', 'Step 1', '识别股票', '正在解析…', 'active');

    if (eventSource) eventSource.close();
    eventSource = new EventSource(url);

    eventSource.addEventListener('node_done', e => {
      const d = JSON.parse(e.data);
      if (d.node === 'resolve') {
        addTimelineStep('resolve', 'Step 1', '识别股票',
          d.resolved_name + ' (' + d.resolved_code + ')', 'done');
        addTimelineStep('industry', 'Step 2', '产业链', '分析中…', 'active');
      }
      if (d.node === 'industry_context') {
        const peerCount = (d.peers||[]).length;
        const detail = d.csic_sector + (peerCount ? ' · ' + peerCount + ' 同行' : '');
        addTimelineStep('industry', 'Step 2', '产业链', detail, 'done');
        // LLM 产业链上下文
        if (d.industry_context) {
          addMsg(md2html(d.industry_context), 'ai');
        }
        // Web 搜索最新新闻
        if (d.web_news && d.web_news.length) {
          const newsHtml = '<div style="font-size:12px;color:var(--muted)">🔍 <b>最新搜索</b><br>' +
            d.web_news.slice(0,3).map(n => '· <a href="'+n.url+'" target="_blank" style="color:var(--primary)">'+esc(n.title)+'</a>').join('<br>') + '</div>';
          addMsg(newsHtml, 'ai');
        }
        addTimelineStep('fetch', 'Step 3', '财务数据', 'Baostock…', 'active');
      }
      if (d.node === 'fetch_data') {
        addTimelineStep('fetch', 'Step 3', '财务数据', '已获取', 'done');
        addTimelineStep('score', 'Step 4-6', '估值·质量·成长', '计算中…', 'active');
      }
      if (d.node === 'valuation' || d.node === 'quality' || d.node === 'growth') {
        const stepEl = document.getElementById('step-score');
        if (stepEl) {
          stepEl.querySelector('.step-detail').textContent =
            'PE ' + (d.pe||'?') + ' | ROE ' + (d.roe||'?') + '%';
        }
      }
      if (d.node === 'ai_thesis') {
        addTimelineStep('score', 'Step 4-6', '估值·质量·成长',
          '评分 ' + (d.total_score||0) + ' · ' + (d.recommendation||''), 'done');
        addStockCard(d);
        setStatus(false);
        eventSource.close();
      }
      if (d.error) {
        addTimelineStep(d.node, '✕', d.node, d.error, 'fail');
      }
    });

    eventSource.addEventListener('error', e => {
      addMsg('❌ 分析出错', 'system');
      setStatus(false);
      eventSource.close();
    });
    eventSource.addEventListener('end', () => { setStatus(false); eventSource.close(); });
    return;
  }

  // ── 宏观分析 (原有逻辑) ──
  addTimelineStep('macro', 'Step 1', '宏观分析', '正在调用 DeepSeek 分析市场…', 'active');

  if (eventSource) eventSource.close();
  eventSource = new EventSource('/api/analyze?' + new URLSearchParams({q: text}));

  // ── 节点完成事件 ──
  eventSource.addEventListener('node_done', e => {
    const d = JSON.parse(e.data);

    if (d.node === 'macro') {
      addTimelineStep('macro', 'Step 1', '宏观分析',
        (d.sectors||[]).join(' • ') + ' (' + (d.sectors||[]).length + ' 个板块)', 'done');
      addTimelineStep('lookup', 'Step 2', '缓存查分', '查询中…', 'active');
      if (d.macro_reasoning) {
        addMsg(md2html(d.macro_reasoning), 'ai');
      }
    }

    if (d.node === 'lookup') {
      addTimelineStep('lookup', 'Step 2', '缓存查分',
        'Top ' + (d.top_count||0) + ' · ' + (d.summary||''), 'done');
      if (d.top_picks && d.top_picks.length) {
        addCards(d.top_picks);
      }
      setStatus(false);
      eventSource.close();
    }

    // 错误处理
    if (d.error) {
      addTimelineStep(d.node, '✕', d.node, d.error, 'fail');
    }
  });

  // ── 错误事件 ──
  eventSource.addEventListener('error', e => {
    let msg = '分析出错';
    try { const d = JSON.parse(e.data); msg = d.error || msg; } catch (_) {}
    addMsg('❌ ' + msg, 'system');
    setStatus(false);
    eventSource.close();
  });

  // ── 结束事件 ──
  eventSource.addEventListener('end', () => {
    setStatus(false);
    eventSource.close();
  });

  // ── 连接错误 ──
  eventSource.onerror = () => {
    if (eventSource.readyState === EventSource.CLOSED) {
      setStatus(false);
    }
  };
}

// ── Enter 键 ──
const userInput = document.getElementById('userInput');
userInput.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    sendMessage();
  }
});
// ── URL 参数：从 /scores 页面点过来时自动触发个股分析 ──
(function autoFromUrl() {
  const params = new URLSearchParams(window.location.search);
  const code = params.get('code');
  if (code) {
    setTimeout(() => {
      document.getElementById('userInput').value = '分析 ' + code;
      sendMessage();
      window.history.replaceState({}, '', '/ai');
    }, 400);
  }
})();
</script>
